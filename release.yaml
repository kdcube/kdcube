platform:
  repo: "kdcube-ai-app"
  ref: "2026.09.13.0145"
  description: |
    This release follows 2026.09.02.1429 and carries the authority work of the
    two weeks after it, so the packaged CLI can be published at the version the
    repository already declares.

    Delegated authority is now carried by the Card itself, end to end: a Card
    is the delegation edge through the Data Bus, application Cards downscope
    runtime roles and are enforced per operation, conversation reads are scoped
    on every transport, and conversation targets are enforced per application
    across named-service calls. An application owns its delegated catalog,
    which the CLI can check and apply as reviewed fragments.

    Agent capabilities became a Card boundary: a descriptor's declaration is
    the ceiling, the per-user Agent Card holds the defaults a new conversation
    starts from, a conversation selects within the live Control Card, and a
    retained selection the declaration no longer allows reads as missing.

    OAuth gained the device authorization flow for hosts without a browser,
    whole-Card agent credentials, and a first consent seeded from the
    requested authority instead of an empty pick list. Login state moved to
    the host secret backend, and create-only ephemeral secret custody landed
    beneath it.

    The hybrid index re-exports from app-foundation, an empty query browses a
    scope, a lexical-only collection stops paying for vectors, and hybrid
    search can return the matched passage.

config:
  version: "2026.09.13.0145"
