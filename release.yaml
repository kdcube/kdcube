platform:
  repo: "kdcube-ai-app"
  ref: "2026.10.19.1830"
  description: |
    This release follows 2026.10.18.158. It publishes the platform images
    and the tag, and it is the record the packaged CLI is published from.

    The processor and executor require connection-hub, project-board and
    app-foundation[mcp] >=2026.10.19.1800,<2027. The ingress requires
    connection-hub and app-foundation at the same floor. This includes the
    Project Board worker contract and CLI for importing project exports, and
    the Connection Hub participant failure diagnostics from that package set.

    These ranges set minimum versions; the release image verification records
    the installed package versions and image identities.

config:
  version: "2026.10.19.1830"
