platform:
  repo: "kdcube-ai-app"
  ref: "2026.10.23.1100"
  description: |
    This release follows 2026.10.19.2230. It publishes the platform images
    and the tag, and it is the record the packaged CLI is published from.

    The Connection Hub CLI can set a secret on a deployment end to end. When
    the calling Card does not hold the secret resource, the management
    service now returns the Hub's Card-grant consent as a CLI recovery bound
    to that request (kdcube/kdcube#412). kdcube-cli accepts it with the same
    origin, consent-path, request and choice checks as a request permit.
    The secrets README describes both consent kinds (kdcube/kdcube#411).

    A session issued by the OAuth original exchange now refreshes. Its
    refresh record names the plan's Card selectors as resources, which the
    refresh handler did not read, so every such connector session was refused
    at its first refresh with card_resource_not_covered (kdcube/kdcube#413).
    A refused original-exchange authorization logs a finite reason
    (kdcube/kdcube#410).

    It also includes the site catalog convergence (kdcube/kdcube#409) and the
    MCP surface and token refresh using the Hub request policy
    (kdcube/kdcube#408).

    Package floors are unchanged: the processor and executor require
    connection-hub, project-board and app-foundation[mcp]
    >=2026.10.19.2200,<2027; the ingress, dbdeploy and metric-service images
    require connection-hub at that floor. These ranges set minimum versions;
    the release image verification records the installed package versions
    and image identities.

config:
  version: "2026.10.23.1100"
