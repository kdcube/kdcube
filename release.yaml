platform:
  repo: "kdcube-ai-app"
  ref: "2026.10.18.158"
  description: |
    This release follows 2026.10.17.2103. It publishes the platform images
    and the tag, and it is the record the packaged CLI is published from.

    **The chat-ingress image installs app-foundation.** The ingress web app
    imports the conversation search, which reaches the index and vector-store
    primitives of app-foundation. The 2026.10.17.2103 ingress image did not
    install that package and failed at startup with "No module named
    'app_foundation'". The ingress requirements now declare
    app-foundation >=2026.10.17.2026 (#396), the floor the processor and
    executor images already use.

config:
  version: "2026.10.18.158"
