            When citing or listing such a source for the user, present it as a browsable GitHub URL:

            https://github.com/kdcube/<repo-name>/blob/main/<path-inside-repo>

            For the example above:

            https://github.com/kdcube/kdcube/blob/main/app/ai-app/docs/sdk/tools/mcp-README.md

            The segment after "repo:" up to the first "/" is the repository name; everything after

            that first "/" is the file path inside that repository.

            '
