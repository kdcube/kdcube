            - resource: '*/api/integrations/bundles/*/*/user-memories@2026-06-26/public/mcp/memories*'
              identity_scope: grantor_identity_family
              tools:
                memory_search:
                  label: Search memories
                  description: Search memory notes visible to the connected user.
                  grants:
                  - memories:read
                memory_get:
                  label: Read one memory
                  description: Read a memory note by id.
                  grants:
                  - memories:read
            consent_ui:
              mode: authority_provider
              authority_id: kdcube.platform
              provider_id: workspace_google_session
              entrypoint: consent
        providers: {}
        delegated_to_kdcube:
          enabled: true
          oauth:
            public_base_url: https://<PUBLIC_HOST>
          providers:
            google:
              label: Google
              adapter: google.oauth
              enabled: true
              connector_apps:
                gmail:
                  label: Gmail
                  enabled: true
                  client_id: <FILL_ME>
                  client_secret_ref: connections.delegated_to_kdcube.providers.google.connector_apps.gmail.client_secret
                  allowed_claims:
                  - gmail:read
                  - gmail:send
                  - sheets:read
                  - sheets:write
                  - docs:read
                  - docs:write
                  - docs:comment
              claims:
                gmail:read:
                  label: Read Gmail
                  description: Search and read Gmail messages for the approving user.
                  provider_scopes:
                  - openid
                  - email
                  - profile
                  - https://www.googleapis.com/auth/gmail.readonly
                gmail:send:
                  label: Send Gmail
                  description: Send email through the approving user's Gmail account.
                  provider_scopes:
                  - openid
                  - email
                  - profile
                  - https://www.googleapis.com/auth/gmail.send
                sheets:read:
                  label: Read Google Sheets
                  description: Find spreadsheets and read their metadata and values.
                  provider_scopes:
                  - openid
                  - email
                  - profile
                  - https://www.googleapis.com/auth/spreadsheets.readonly
                  - https://www.googleapis.com/auth/drive.metadata.readonly
                sheets:write:
                  label: Edit Google Sheets
                  description: Create and edit spreadsheets, tabs, values, and formatting.
                  provider_scopes:
                  - openid
                  - email
                  - profile
                  - https://www.googleapis.com/auth/spreadsheets
                  - https://www.googleapis.com/auth/drive.metadata.readonly
                  # create_spreadsheet makes a Drive file; drive.file is the
                  # least-privilege Drive write scope it needs.
                  - https://www.googleapis.com/auth/drive.file
                docs:read:
                  label: Read Google Docs
                  description: Find documents and read or export their content.
                  provider_scopes:
                  - openid
                  - email
                  - profile
                  - https://www.googleapis.com/auth/documents.readonly
                  - https://www.googleapis.com/auth/drive.readonly
                docs:write:
                  label: Edit Google Docs
                  description: Create, copy, edit, embed images into, and import Google documents.
                  provider_scopes:
                  - openid
                  - email
                  - profile
                  - https://www.googleapis.com/auth/documents
                  - https://www.googleapis.com/auth/drive.file
                docs:comment:
                  label: Comment on Google Docs
                  description: Read and write comments and replies on Google documents.
                  provider_scopes:
                  - openid
                  - email
                  - profile
                  - https://www.googleapis.com/auth/drive
            slack:
              label: Slack
              adapter: slack.oauth_user_token
              enabled: true
              connector_apps:
                slack-demo:
                  label: KDCube Slack
                  enabled: true
                  client_id: <FILL_ME>
                  client_secret_ref: connections.delegated_to_kdcube.providers.slack.connector_apps.slack-demo.client_secret
                  allowed_claims:
                  - slack:search
                  - slack:post
                  - slack:channels
                  - slack:history
                  - slack:files:read
                  - slack:files:write
                  - slack:assistant:search
              claims:
                slack:search:
                  label: Search Slack
                  description: Search Slack content visible to the approving user.
                  provider_scopes:
                  - search:read
                slack:post:
                  label: Post to Slack
                  description: Post messages into Slack destinations allowed by the approving user.
                  provider_scopes:
                  - chat:write
                  - im:write
                slack:channels:
                  label: List Slack channels
                  description: List Slack conversations visible to the approving user.
                  provider_scopes:
                  - channels:read
                  - groups:read
                  - im:read
                  - mpim:read
                slack:history:
                  label: Read Slack history
                  description: Read Slack conversation history visible to the approving user.
                  provider_scopes:
                  - channels:history
                  - groups:history
                  - im:history
                  - mpim:history
                slack:files:read:
                  label: Read Slack files
                  description: Read and download Slack files visible to the approving user.
                  provider_scopes:
                  - files:read
                slack:files:write:
                  label: Upload Slack files
                  description: Upload files to Slack destinations allowed by the approving user.
                  provider_scopes:
                  - files:write
                  - im:write
                slack:assistant:search:
                  label: Use Slack assistant search
                  description: Use Slack AI semantic search across messages, files, channels, and users where available.
                  provider_scopes:
                  - search:read.public
                  - search:read.private
                  - search:read.im
                  - search:read.mpim
                  - search:read.files
                  - search:read.users
            linkedin:
              label: "LinkedIn"
              adapter: "linkedin.oauth_member"
              enabled: true
              connector_apps:
                demo:
                  label: "KDCube LinkedIn"
                  enabled: true
                  client_id: "<LINKEDIN_OAUTH_CLIENT_ID>"
                  client_secret_ref: "connections.delegated_to_kdcube.providers.linkedin.connector_apps.demo.client_secret"
                  allowed_claims:
                  - "linkedin:profile"
                  - "linkedin:post"
                # Organization lane: a SEPARATE LinkedIn app carrying the
                # Community Management API product — LinkedIn requires that
                # product to be the only one on its app, so it can never share
                # an app with Sign In / Share on LinkedIn. Its allowed_claims
                # ceiling carries only the org claims, which routes org
                # connects to this app (claims-driven connector narrowing).
                org:
                  label: "KDCube LinkedIn Org"
                  enabled: false
                  client_id: "<LINKEDIN_ORG_OAUTH_CLIENT_ID>"
                  client_secret_ref: "connections.delegated_to_kdcube.providers.linkedin.connector_apps.org.client_secret"
                  allowed_claims:
                  - "linkedin:org:post"
                  - "linkedin:org:read"
              claims:
                linkedin:profile:
                  label: "Read your LinkedIn profile"
                  description: "Read the approving member's own LinkedIn name and email."
                  provider_scopes:
                  - "openid"
                  - "profile"
                  - "email"
                # w_member_social covers posting AND commenting; LinkedIn has no
                # separate comment scope outside Community Management API.
                linkedin:post:
                  label: "Post and comment on LinkedIn"
                  description: "Publish posts and comments on LinkedIn as the approving member."
                  provider_scopes:
                  - "w_member_social"
                # Organization-lane claims: org scopes only — the adapter must
                # NOT force openid/profile on these (a Community Management API
                # app has no Sign In product, and LinkedIn rejects scopes no
                # enabled product grants).
                linkedin:org:post:
                  label: "Post as your organization page"
                  description: "Publish posts as the LinkedIn organization page the approving member administers."
                  provider_scopes:
                  - "w_organization_social"
                linkedin:org:read:
                  label: "Read your organization page's posts and engagement"
                  description: "Read posts, comments, and reaction counts of the LinkedIn organization page the approving member administers."
                  provider_scopes:
                  - "r_organization_social"
            icloud_mail:
              label: iCloud Mail
              adapter: email.imap_smtp_app_password
              enabled: true
              connector_apps:
                app_password:
                  label: iCloud app-specific password
                  enabled: true
                  allowed_claims:
                  - email:read
                  - email:send
              claims:
                email:read:
                  label: Read mail
                  description: Read mail through IMAP for the connected mailbox.
                email:send:
                  label: Send mail
                  description: Send mail through SMTP for the connected mailbox.
      identity:
        enabled: true
        authenticator_selector_cache:
          enabled: true
          ttl_seconds: 30
        role_resolver:
          mode: platform
        role_bindings: {}
        authenticators:
        - id: telegram.kdcube_ref
          provider: telegram
          where: built-in
          enabled: true
          role_providing: false
          secret_ref: identity.authenticators.telegram_kdcube_ref.bot_token
          definition:
            label: KDCube Ref Telegram bot
            web_app_auth_max_age_seconds: 86400
        link_flows:
          telegram:
            enabled: true
            challenge_ttl_seconds: 600
            platform_claim_url: ''
      authority_registry:
        authorities:
          kdcube.platform:
            label: KDCube platform authority
            platform: true
            grants:
              subjects: {}
              bootstrap_rules:
              - id: bootstrap_admin_by_google_email
                when:
                  provider: google
                  claims:
                    email: <ADMIN_EMAIL>
                    email_verified: true
                roles:
                - kdcube:role:super-admin
                permissions:
                - kdcube:*:*:*
            providers:
              # Cognito platform-authority alternative. Select it through
              # assembly auth.connection_hub.provider_id after replacing the
              # placeholders; keep login and hosted logout on the same pool.
              # cognito:
              #   type: multi_cognito
              #   enabled: true
              #   label: KDCube Cognito platform session
              #   authenticator:
              #     type: cognito_id_token
              #     id_token_header_name: X-ID-Token
              #     region: eu-west-1
              #     user_pool_id: eu-west-1_PRIMARY
              #     app_client_id: primary-client
              #     hosted_ui_domain: https://auth.example.com
              #     service_client_id: primary-client
              #     jwks_cache_ttl_seconds: 86400
              #     cookie:
              #       auth_token_cookie_name: __Secure-LATC
              #       id_token_cookie_name: __Secure-LITC
              #       masqueraded_token_cookie_name: __Secure-LMTC
              workspace_google_session:
                type: bundle_session_login
                enabled: true
                label: Workspace Google platform session
                input:
                  authenticator_ref:
                    authority_id: google.accounts
                    provider_id: google_oidc
                issuer:
                  type: kdcube_session_token
                  ttl_seconds: 43200
                  cookie:
                    secure: true
                    same_site: lax
                    auth_token_cookie_name: __Secure-LATC
                    id_token_cookie_name: __Secure-LITC
                    masqueraded_token_cookie_name: __Secure-LMTC
                grants:
                  default:
                    roles:
                    - kdcube:role:registered
                    permissions: []
                  assignable:
                    roles:
                    - kdcube:role:registered
                    - kdcube:role:super-admin
                    permissions:
                    - kdcube:*:chat:*;read;write
                    - kdcube:*:*:*
                entrypoints:
                  login:
                    bundle_id: workspace@2026-03-31-13-36
                    route: public
                    operation: platform_login
                  session_issue:
                    bundle_id: workspace@2026-03-31-13-36
                    route: public
                    operation: auth_google_session
                  consent:
                    bundle_id: workspace@2026-03-31-13-36
                    route: public
                    operation: delegated_consent
          google.accounts:
            label: Google Accounts
            platform: false
            providers:
              google_oidc:
                type: google_id_token
                enabled: true
                authenticator:
                  client_id: <FILL_ME>
          telegram.kdcube_ref:
            label: KDCube Ref Telegram identity
            platform: false
            providers:
              telegram_bot_init_data:
                type: telegram_init_data
                enabled: true
                authenticator:
                  secret_ref: identity.authenticators.telegram_kdcube_ref.bot_token
      ui:
        widgets:
          connections_settings:
            enabled: true
            src_folder: ui/widgets/connections
            build_command: npm install --no-package-lock && OUTDIR=<VI_BUILD_DEST_ABSOLUTE_PATH> npm run build
  - id: kdcube-services@1-0
    name: KDCube Services
    singleton: false
    config:
      named_services:
        schema_search:
          vector_backend: faiss-local
      surfaces:
        as_provider:
          bundle:
            visibility:
              allowed_roles: []
          mcp:
            conversations:
              auth:
                mode: managed
                authority_id: delegated_client
                selected_tool_grants: true
            named_services:
              auth:
