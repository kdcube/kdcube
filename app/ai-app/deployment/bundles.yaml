          - model: claude-sonnet-5
            provider: anthropic
            label: Sonnet 5
          - model: claude-fable-5
            provider: anthropic
            label: Fable 5
          # Locally served models (provider: custom) route through the models
          # gateway's custom endpoint (see the commented `services.llm.custom`
          # block below). Uncomment both when the deployment runs a local
          # server (e.g. Ollama) reachable from the gateway.
          # - model: qwen3.6:35b
          #   provider: custom
          #   label: Qwen3.6 35B (local)
          #   num_ctx: 65536
          # - model: qwen3:8b
          #   provider: custom
          #   label: Qwen3 8B (local, fast)
          #   num_ctx: 40960
          # - model: mistral:7b-instruct-v0.2-q4_K_M
          #   provider: custom
          #   label: Mistral 7B Instruct v0.2 (local)
          #   num_ctx: 32768
          # Users pick an instruction set per conversation alongside the model.
          # Workspace starts with the distilled `extra-lite` profile; users may
          # select `full` or `lite` when a task needs their broader instruction set.
          # A profile's `blocks` compose the instruction body in the order given.
          # One unified vocabulary: `full` (the complete default set; monolithic),
          # `lite:<profile>` / `xlite:<profile>` (a whole moderate/extra-lite
          # profile in one token), single `REACT_LITE_*` / `REACT_XLITE_*` blocks,
          # or literal text. A profile with no `blocks` uses the full default set.
          # Stored sets: instr:custom:<id>[:<version>] (admin-authored, versioned);
          # predefined: instr:profile:full|lite|extra-lite.
          # Profiles: core · workspace · workspace_exec · document · web · all_capabilities.
          instruction_profiles:
            default: extra-lite
