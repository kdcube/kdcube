  - id: ported-langgraph-agents@2026-07-13
    singleton: false
    config:
      role_models:
        lg-solution.answer:
          provider: anthropic
          model: claude-sonnet-4-5-20250929
        lg-react.answer:
          provider: anthropic
          model: claude-haiku-4-5-20251001
      surfaces:
        as_provider:
          bundle:
            default_chat: true
            visibility:
              allowed_roles: []
        as_consumer:
          default_agent: lg-solution
          # Scene composition (declared, not hardcoded): components the scene
          # mounts beyond its code defaults (the two chat tiles), merged by
          # alias via the app's `scene_surface_config` operation. The Connection
          # Hub component keeps consent in-house — chat consent cards and the
          # capabilities picker's Grant affordance summon it via the declared
          # target_surfaces (the `connections.hub.open` contract). Requires
          # connection-hub@1-0 deployed with its connections_settings widget.
          ui:
            scene:
              components:
                connection_hub:
                  bundle_id: connection-hub@1-0
                  widget_alias: connections_settings
                  title: Connection Hub
                  accent: purple
                  gated: true
                  views: false
                  params:
                    tab: delegated_by_kdcube
                  size: { w: 880, h: 720 }
                  full: { w: 1120, h: 820 }
                  target_surfaces:
                    - connection_hub.connections
                    - connection_hub.settings
                  placement: floating
                  rail: true
                  default_open: false
                  enabled: true
                  order: 30
          agents:
            lg-solution:
              # Answer-model OUTPUT budget (max output tokens per model call) — a
              # generous safety cap, never a target; the model stops on its own.
              model:
                max_tokens: 8192
              capability_provider: simple_model_pick
              capabilities:
                models:
                  role: lg-solution.answer
                  default: claude-sonnet-4-5-20250929
                  supported:
                    - {model: claude-sonnet-4-5-20250929, provider: anthropic, label: Sonnet 4.5}
                    - {model: claude-haiku-4-5-20251001, provider: anthropic, label: Haiku 4.5}
                # Stoppable mid-run (the steer cancels the graph stream; the checkpointer
                # holds the last completed node). A mid-run message is NOT folded into the
                # running graph - it folds into the next turn, leaving the graph's own
                # iteration management intact.
                conversation:
                  accepts_steer: true
                  accepts_followup: false
            lg-react:
              # HIGHER budget: this agent passes whole payloads as tool arguments
              # (run_python carries the full program text) — the budget must fit
              # narration + ONE complete tool call, or the response is cut
              # mid-arguments and the agent loops on tool validation errors.
              model:
                max_tokens: 16384
              # Agent-admin customization — appended LAST in lg-react's system
              # prompt inside the SDK's admin-customization HARD-OVERRIDE
              # envelope (same convention ReAct agents honor). Empty = no block.
              additional_instructions: ''
              capability_provider: simple_model_pick
              capabilities:
                models:
                  role: lg-react.answer
                  default: claude-haiku-4-5-20251001
                  supported:
                    - {model: claude-haiku-4-5-20251001, provider: anthropic, label: Haiku 4.5}
                    - {model: claude-sonnet-4-5-20250929, provider: anthropic, label: Sonnet 4.5}
                # Stoppable mid-run (the steer cancels the graph stream; the checkpointer
                # holds the last completed node). A mid-run message is NOT folded into the
                # running graph - it folds into the next turn, leaving the graph's own
                # iteration management intact.
                conversation:
                  accepts_steer: true
                  accepts_followup: false
              tools:
                - {name: calc, kind: python, alias: calc, allowed: [calc]}
                - {name: unit_convert, kind: python, alias: unit_convert, allowed: [unit_convert]}
                - {name: kb_search, kind: python, alias: kb_search, allowed: [kb_search]}
                - name: code_exec
                  kind: python
                  alias: code_exec
                  allowed: [run_python]
                  code_exec:
                    timeout_s: 120
                # Platform web tools (PAID): web_search meters on the search
                # provider (key: services.brave.api_key or per-deployment backend);
                # result filtering/segmentation bills as llm through this app's
                # accounted model service.
                - name: web
                  kind: python
                  alias: web
                  allowed: [web_search, web_fetch]
                # Delegated MCP (optional; the agent calls a KDCube @mcp surface AS
                # the signed-in user, under a PER-AGENT consent grant the user gives
                # and revokes in Connection Hub). `resource` is the delegated-resource
                # id from `delegated_credentials.oauth.resources` (often a wildcard
                # pattern) — the grant is created and looked up under this exact key.
                # Fill <PUBLIC_HOST>/<TENANT>/<PROJECT> (the install tooling
                # resolves these); the target apps ship built-in, so a fresh
                # install demonstrates the delegated surface — consent-gated,
                # dropping until the user connects accounts and grants this agent.
                - name: memories
                  kind: mcp
                  server_id: memories
                  url: "https://<PUBLIC_HOST>/api/integrations/bundles/<TENANT>/<PROJECT>/user-memories@2026-06-26/public/mcp/memories"
                  resource: "*/api/integrations/bundles/*/*/user-memories@2026-06-26/public/mcp/memories*"
                  transport: streamable_http
                  delegated: true
                  scopes: [memories:read]
                # PER-SERVICE SHAPE — the named-services bridge for ONE service
                # (Slack on the user's connected account), scoped to its claims:
                # the per-agent grant admits the agent into the KDCube namespace
                # boundary; the user's own connected-account Slack consent (Delegated
                # to KDCube) is checked at every call — revoking either stops the
                # tool. Each service gets its OWN consent and its OWN picker toggle.
                # - name: slack
                #   kind: mcp
                #   server_id: slack
                #   alias: slack
                #   url: "https://<PUBLIC_HOST>/api/integrations/bundles/<TENANT>/<PROJECT>/kdcube-services@1-0/public/mcp/named_services"
                #   resource: "*/api/integrations/bundles/*/*/kdcube-services@1-0/public/mcp/named_services*"
                #   transport: streamable_http
                #   delegated: true
                #   scopes: [named_services:use]   # Slack's real claims consent per account, not in scopes
                # WHOLE-SURFACE SHAPE — one delegated connection to the SAME door
                # serves ALL namespaces the grant's scopes allow: one consent, one
                # picker toggle; per-namespace control lives in `scopes`, and
                # `named_services_list` is the runtime source of truth. The
                # companion `kind: named_service` roster entry binds NO tools —
                # it declares the consumed namespaces so the system prompt gets
                # the namespace roster (+ the conversation-recovery block when
                # `conv` is declared). Trade-offs:
                # docs/agents/lg-react-named-services-config.md (in the bundle).
                # Ships scoped to CONV only — the conversation namespace is
                # built-in (served by kdcube-services), so it works on a fresh
                # install with no extra setup. Provider namespaces (slack, mail)
                # need their OAuth app configured in Connection Hub first; then
                # declare the namespace under the roster. Account-backed claims
                # (Slack's real `slack:search`/`slack:post`/…, mail's agnostic
                # `mail:read`/`mail:send`) consent PER ACCOUNT in Connection Hub —
                # they do NOT go in `scopes`. Only internal namespaces (conv,
                # memories, tasks) carry a namespace claim like `conv:read` here.
                - name: named_services
                  kind: mcp
                  server_id: named_services
                  alias: named_services
                  url: "https://<PUBLIC_HOST>/api/integrations/bundles/<TENANT>/<PROJECT>/kdcube-services@1-0/public/mcp/named_services"
                  resource: "*/api/integrations/bundles/*/*/kdcube-services@1-0/public/mcp/named_services*"
                  transport: streamable_http
                  delegated: true
                  scopes: [named_services:use, conv:read]
                - name: named_services_roster
                  kind: named_service
                  alias: named_services
                  namespaces:
                    conv:  { allowed: [provider.about, object.search, object.get] }
      ui:
        main_view:
          src_folder: ui/scene
          build_command: npm install --no-package-lock && OUTDIR=<VI_BUILD_DEST_ABSOLUTE_PATH> npm run build
          shared_sources:
            components_react_scene:
              src_folder: npm://components-react/src/scene
              target: _shared/components-react/scene
            components_core_scene:
              src_folder: npm://components-core/src/scene
              target: _shared/components-core/scene
            components_core_events:
              src_folder: npm://components-core/src/events
              target: _shared/components-core/events
            components_core_shared:
              src_folder: npm://components-core/src/shared
              target: _shared/components-core/shared
        widgets:
          chat_lg_solution:
            src_folder: sdk://solutions/chat/ui/widget
            engine: package-ui
            build_command: npm install --no-package-lock && VITE_CHAT_AGENT_ID="lg-solution" VITE_CHAT_BRAND_LABEL="lg-solution" VITE_CHAT_WIDGET_ID="chat_lg_solution" VITE_CHAT_CONFIG_IDENTITY="BUNDLE_LG_SOLUTION_CHAT_VIEW" VITE_CHAT_EVENT_PREFIX="lg_solution" OUTDIR=<VI_BUILD_DEST_ABSOLUTE_PATH> npm run build
          chat_lg_react:
            src_folder: sdk://solutions/chat/ui/widget
            engine: package-ui
            build_command: npm install --no-package-lock && VITE_CHAT_AGENT_ID="lg-react" VITE_CHAT_BRAND_LABEL="lg-react" VITE_CHAT_WIDGET_ID="chat_lg_react" VITE_CHAT_CONFIG_IDENTITY="BUNDLE_LG_REACT_CHAT_VIEW" VITE_CHAT_EVENT_PREFIX="lg_react" OUTDIR=<VI_BUILD_DEST_ABSOLUTE_PATH> npm run build
      visibility:
        widget:
          chat_lg_solution: {user_types: [], roles: []}
          chat_lg_react: {user_types: [], roles: []}
      enabled:
        api:
          public.telegram_webhook.POST: true
      integrations:
        telegram.default:
          provider: telegram
          where: built-in
          enabled: true
          secret_refs:
            bot_token: integrations.telegram_default.definition.bot_token
            webhook_secret: integrations.telegram_default.definition.webhook_secret
          definition:
            bot_name: <FILL_ME>
            bot_username: <FILL_ME>
            webhook:
              url: https://<PUBLIC_HOST>/api/integrations/bundles/<TENANT>/<PROJECT>/ported-langgraph-agents@2026-07-13/public/telegram_webhook?integration_id=telegram.default
              send_responses: true
              stream_activity: true
              stream_activity_display: true
            web_app_auth_max_age_seconds: 86400
  - id: workspace@2026-03-31-13-36
