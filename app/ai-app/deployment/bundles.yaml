# Default bundle descriptors for a fresh KDCube install (base complectation).
# Staged into the runtime config dir by the installer when the operator does
# not supply their own descriptor set; everything here remains editable via
# the AI Bundles dashboard afterwards (the file stays the authority).
#
# Contents: config overlays for the built-in service apps that ship in the
# image and are auto-discovered (no path/module entries needed):
#   connection-hub@1-0        identity, consent, delegated credentials, OAuth
#   kdcube-services@1-0       managed MCP surfaces + named-services bridge
#   website@2026-07-12        application-hosted site registry example
#   user-memories@2026-06-26  the mem provider + memories widget
#   ported-langgraph-agents@2026-07-13  hosted external-agent examples
#   workspace@2026-03-31-13-36  showcase scene + chat wired to everything
#
# Placeholders:
#   <TENANT>, <PROJECT>       substituted by the installer at init
#   <ADMIN_EMAIL>             substituted from KDCUBE_ADMIN_EMAIL when set —
#                             the Google account bootstrapped as super-admin
#   <PUBLIC_HOST>             substituted from KDCUBE_PUBLIC_HOST when set,
#                             otherwise left for the operator (OAuth redirect
#                             URIs and webhooks need the real public host)
#   <VI_BUILD_DEST_ABSOLUTE_PATH>  resolved at widget-build time by the
#                             runtime — leave verbatim
# Matching secrets skeleton: bundles.secrets.yaml (same directory).
bundles:
  version: '1'
  default_bundle_id: workspace@2026-03-31-13-36
  items:
  - id: connection-hub@1-0
    name: Connection Hub
    singleton: false
    config:
      connections:
        oauth:
          public_base_url: https://<PUBLIC_HOST>
        delegated_credentials:
          catalog:
            active_cache_seconds: 300
            version_cache_seconds: 3600
          cards:
            updating_marker_seconds: 15
            revoked_tombstone_seconds: 60
          oauth:
            enabled: true
            brand: KDCube
            issuer: ''
            public_clients:
            - client_id: claude
              redirect_uris:
              - https://claude.ai/api/mcp/auth_callback
              - http://localhost/callback
              - http://127.0.0.1/callback
            dynamic_client_registration:
              enabled: true
              allowed_redirect_uris:
              - https://claude.ai/api/mcp/auth_callback
              - http://localhost/callback
              - http://127.0.0.1/callback
            client_id_metadata_documents:
              enabled: true
              # Empty permits any public HTTPS metadata host. The resolver
              # still rejects private addresses, redirects, and large bodies.
              allowed_domains: []
              allow_subdomains: true
            capabilities:
            - grant: kdcube:role:super-admin
              label: Use all platform and application APIs
              description: Admin-only delegated automation access to every authenticated KDCube platform and application API.
              delegable_roles:
              - kdcube:role:super-admin
              delegable_permissions:
              - kdcube:role:super-admin
            - grant: conversations:read
              label: Read your conversations
              description: Read the approving user's own KDCube conversations through delegated named-service tools.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - kdcube:*:conversations:*;read
            - grant: conversations:read:any_user
              label: Read any user's conversations
              description: Admin read of a selected user's conversations through the conv named service.
              delegable_roles:
              - kdcube:role:super-admin
              delegable_permissions:
              - kdcube:*:conversations:*;read:any_user
            - grant: memories:read
              label: Read KDCube memories
              description: Read the user's KDCube memory notes through delegated MCP tools.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - memories:read
            - grant: memories:write
              label: Write KDCube memories
              description: Create or update the user's KDCube memory notes through delegated named-service tools.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - memories:write
            - grant: instr:read
              label: Read agent instruction sets
              description: List and read stored, versioned agent instruction sets.
              delegable_roles:
                - kdcube:role:registered
                - kdcube:role:paid
                - kdcube:role:privileged
                - kdcube:role:super-admin
              delegable_permissions:
                - instr:read
            - grant: instr:write
              label: Manage agent instruction sets
              description: Save new versions of stored agent instruction sets or retire them (administrator operation).
              delegable_roles:
                - kdcube:role:super-admin
              delegable_permissions:
                - instr:write
            - grant: canvas:read
              label: Read KDCube canvas
              description: Read canvas objects through delegated named-service tools.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - canvas:read
            - grant: canvas:write
              label: Write KDCube canvas
              description: Create or update canvas objects through delegated named-service tools.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - canvas:write
            - grant: named_services:use
              label: Use KDCube named services
              description: Discover and call configured KDCube named-service namespaces through delegated MCP tools.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - named_services:use
            - grant: mail:read
              label: Read connected mail
              description: Search and read messages and attachments from mail accounts connected to KDCube.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - mail:read
              # Door claim: the consent page resolves it to the account(s) that
              # back it (any one satisfies). Keep in step with
              # MAIL_CONNECTED_ACCOUNT_REQUIREMENTS.
              connected_accounts:
              - provider_id: google
                claims: ["gmail:read"]
            - grant: mail:send
              label: Send connected mail
              description: Send or forward messages through mail accounts connected to KDCube.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - mail:send
              connected_accounts:
              - provider_id: google
                claims: ["gmail:send"]
            - grant: sheets:read
              label: Read Google Sheets
              description: Find spreadsheets and read their metadata and values through a connected Google account.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - sheets:read
            - grant: sheets:write
              label: Edit Google Sheets
              description: Create and edit spreadsheets, tabs, values, and formatting through a connected Google account.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - sheets:write
            - grant: docs:read
              label: Read Google Docs
              description: Find documents and read or export their content through a connected Google account.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - docs:read
            - grant: docs:write
              label: Edit Google Docs
              description: Create, copy, edit, embed images into, and import Google documents through a connected Google account.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - docs:write
            - grant: docs:comment
              label: Comment on Google Docs
              description: Read and write comments and replies on Google documents through a connected Google account.
              delegable_roles:
              - kdcube:role:registered
              - kdcube:role:paid
              - kdcube:role:privileged
              - kdcube:role:super-admin
              delegable_permissions:
              - docs:comment
            # Slack is a single provider, so it uses its OWN real claims (the
            # exact capabilities the Slack API needs), not an invented namespace
            # claim. These match SLACK_CONNECTED_ACCOUNT_CLAIMS.
            - grant: slack:search
              label: Search Slack
              description: Search messages and files through connected Slack accounts.
              delegable_roles: [kdcube:role:registered, kdcube:role:paid, kdcube:role:privileged, kdcube:role:super-admin]
              delegable_permissions: [slack:search]
            - grant: slack:channels
              label: List Slack channels
              description: List channels and workspaces through connected Slack accounts.
              delegable_roles: [kdcube:role:registered, kdcube:role:paid, kdcube:role:privileged, kdcube:role:super-admin]
              delegable_permissions: [slack:channels]
            - grant: slack:history
              label: Read Slack history
              description: Read channel message history through connected Slack accounts.
              delegable_roles: [kdcube:role:registered, kdcube:role:paid, kdcube:role:privileged, kdcube:role:super-admin]
              delegable_permissions: [slack:history]
            - grant: slack:files:read
              label: Read Slack files
              description: Download files through connected Slack accounts.
              delegable_roles: [kdcube:role:registered, kdcube:role:paid, kdcube:role:privileged, kdcube:role:super-admin]
              delegable_permissions: [slack:files:read]
            - grant: slack:files:write
              label: Upload Slack files
              description: Upload files through connected Slack accounts.
              delegable_roles: [kdcube:role:registered, kdcube:role:paid, kdcube:role:privileged, kdcube:role:super-admin]
              delegable_permissions: [slack:files:write]
            - grant: slack:post
              label: Post to Slack
              description: Post messages through connected Slack accounts.
              delegable_roles: [kdcube:role:registered, kdcube:role:paid, kdcube:role:privileged, kdcube:role:super-admin]
              delegable_permissions: [slack:post]
            - grant: slack:assistant:search
              label: Slack assistant search
              description: Inspect Slack assistant search availability through connected Slack accounts.
              delegable_roles: [kdcube:role:registered, kdcube:role:paid, kdcube:role:privileged, kdcube:role:super-admin]
              delegable_permissions: [slack:assistant:search]
            # LinkedIn, same rule: its own real claims. linkedin:post covers
            # posts and comments because both ride w_member_social.
            - grant: "linkedin:profile"
              label: "Read LinkedIn profile"
              description: "Read the connected LinkedIn member's own profile."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["linkedin:profile"]
            - grant: "linkedin:post"
              label: "Post and comment on LinkedIn"
              description: "Publish posts and comments through connected LinkedIn accounts."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["linkedin:post"]
            - grant: "linkedin:org:post"
              label: "Post as the organization page"
              description: "Publish posts as the organization page through a connected org-lane LinkedIn account."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["linkedin:org:post"]
            - grant: "linkedin:org:read"
              label: "Read organization posts and engagement"
              description: "Read the organization page's posts, comments, and reaction counts through a connected org-lane LinkedIn account."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["linkedin:org:read"]
            resources:
            - resource: '*'
              label: All platform and application APIs
              description: Admin-only delegated automation scope for every authenticated KDCube platform and application API.
              admin_only: true
              grants:
              - kdcube:role:super-admin
            - resource: '*/api/integrations/bundles/*/*/kdcube-services@1-0/public/mcp/conversations*'
              label: KDCube conversations MCP
              tools:
                conversations_export:
                  label: Export conversations
                  description: Read conversation transcripts for feedback triage.
                  grants:
                  - conversations:read
            - resource: '*/api/integrations/bundles/*/*/kdcube-services@1-0/public/mcp/named_services*'
              label: KDCube named services MCP
              tools:
                named_services_list:
                  label: List named services
                  description: List configured named-service namespaces and operation grants.
                  grants:
                  - named_services:use
                named_services_about:
                  label: Named service about
                  description: Read a provider about payload for a configured namespace.
                  grants:
                  - named_services:use
                named_services_capabilities:
                  label: Named service capabilities
                  description: Read provider capabilities for a configured namespace.
                  grants:
                  - named_services:use
                named_services_schema:
                  label: Named service schema
                  description: Read an object schema for a configured namespace.
                  grants:
                  - named_services:use
                named_services_search:
                  label: Named service search
                  description: Search objects in a configured namespace.
                  grants:
                  - named_services:use
                named_services_get:
                  label: Named service get
                  description: Read one object from a configured namespace.
                  grants:
                  - named_services:use
                named_services_upsert:
                  label: Named service upsert
                  description: Create or update one object in a configured namespace.
                  grants:
                  - named_services:use
                named_services_host_file:
                  label: Named service host file
                  description: Host or register a file/ref in a configured namespace.
                  grants:
                  - named_services:use
                named_services_action:
                  label: Named service action
                  description: Run a bounded provider action on one object.
                  grants:
                  - named_services:use
                named_services_delete:
                  label: Named service delete
                  description: Delete or archive one object in a configured namespace.
                  grants:
                  - named_services:use
                named_services_call:
                  label: Named service call
                  description: Run a generic call against a configured namespace.
                  grants:
                  - named_services:use
              named_services:
                # The guarded service declares which connector app serves each
                # provider in its auth scenarios - one per provider type.
                connector_apps:
                  slack: slack-demo
                  google: gmail
                namespaces:
                  instr:
                    label: Agent instruction sets
                    description: Stored, versioned instruction sets wired to agents by ref (instr:custom:<id>[:<version>]).
                    authority_id: delegated_client
                    tools:
                      about:
                        operation: provider.about
                        label: About instruction sets
                        description: Explain the instruction-set namespace and its refs.
                        grants:
                          - named_services:use
                          - instr:read
                      capabilities:
                        operation: provider.capabilities
                        label: Instruction-set capabilities
                        description: Read provider capabilities for the instruction-set namespace.
                        grants:
                          - named_services:use
                          - instr:read
                      list:
                        operation: object.list
                        label: List instruction sets
                        description: List stored instruction sets (latest version per id).
                        grants:
                          - named_services:use
                          - instr:read
                      get:
                        operation: object.get
                        label: Read one instruction set
                        description: Read one stored instruction set by ref, with its version history.
                        grants:
                          - named_services:use
                          - instr:read
                      upsert:
                        operation: object.upsert
                        label: Save instruction-set version
                        description: Save the next immutable version of a stored instruction set (administrator operation).
                        grants:
                          - named_services:use
                          - instr:write
                      delete:
                        operation: object.delete
                        label: Retire instruction set
                        description: Retire one version or every version of a stored instruction set (administrator operation).
                        grants:
                          - named_services:use
                          - instr:write
                  mem:
                    label: User memories
                    description: KDCube memory notes for the approving user.
                    authority_id: delegated_client
                    tools:
                      about:
                        operation: provider.about
                        label: About memories
                        description: Explain the memory namespace and how to use it.
                        grants:
                        - named_services:use
                        - memories:read
                      capabilities:
                        operation: provider.capabilities
                        label: Memory capabilities
                        description: Read provider capabilities for the memory namespace.
                        grants:
                        - named_services:use
                        - memories:read
                      list:
                        operation: object.list
                        label: List memories
                        description: List memory notes visible to the delegated connection.
                        grants:
                        - named_services:use
                        - memories:read
                      schema:
                        operation: object.schema
                        label: Memory schema
                        description: Read the object schema for memory notes.
                        grants:
                        - named_services:use
                        - memories:read
                      search:
                        operation: object.search
                        label: Search memories
                        description: Search memory notes visible to the delegated connection.
                        grants:
                        - named_services:use
                        - memories:read
                      get:
                        operation: object.get
                        label: Read one memory
                        description: Read one memory note by object ref.
                        grants:
                        - named_services:use
                        - memories:read
                      upsert:
                        operation: object.upsert
                        label: Write memory
                        description: Create or update a memory note.
                        grants:
                        - named_services:use
                        - memories:write
                      action:
                        operation: object.action
                        label: Memory action
                        description: Run a bounded provider action on a memory note.
                        grants:
                        - named_services:use
                        - memories:read
                      delete:
                        operation: object.delete
                        label: Delete memory
                        description: Delete or archive a memory note.
                        grants:
                        - named_services:use
                        - memories:write
                      call:
                        label: Generic memory call
                        description: Generic memory namespace call with per-operation grants.
                        operations:
                          provider.about:
                            label: About memories
                            description: Explain the memory namespace and how to use it.
                            grants:
                            - named_services:use
                            - memories:read
                          provider.capabilities:
                            label: Memory capabilities
                            description: Read provider capabilities for the memory namespace.
                            grants:
                            - named_services:use
                            - memories:read
                          object.list:
                            label: List memories
                            description: List memory notes visible to the delegated connection.
                            grants:
                            - named_services:use
                            - memories:read
                          object.schema:
                            label: Memory schema
                            description: Read the object schema for memory notes.
                            grants:
                            - named_services:use
                            - memories:read
                          object.search:
                            label: Search memories
                            description: Search memory notes visible to the delegated connection.
                            grants:
                            - named_services:use
                            - memories:read
                          object.get:
                            label: Read one memory
                            description: Read one memory note by object ref.
                            grants:
                            - named_services:use
                            - memories:read
                          object.upsert:
                            label: Write memory
                            description: Create or update a memory note.
                            grants:
                            - named_services:use
                            - memories:write
                          object.action:
                            label: Memory action
                            description: Run a bounded provider action on a memory note.
                            grants:
                            - named_services:use
                            - memories:read
                          object.delete:
                            label: Delete memory
                            description: Delete or archive a memory note.
                            grants:
                            - named_services:use
                            - memories:write
                  cnv:
                    label: Canvas
                    description: KDCube canvas objects for the approving user.
                    authority_id: delegated_client
                    tools:
                      about:
                        operation: provider.about
                        label: About canvas
                        description: Explain the canvas namespace and how to use it.
                        grants:
                        - named_services:use
                        - canvas:read
                      list:
                        operation: object.list
                        label: List canvas objects
                        description: List canvas objects visible to the delegated connection.
                        grants:
                        - named_services:use
                        - canvas:read
                      schema:
                        operation: object.schema
                        label: Canvas schema
                        description: Read the object schema for canvas objects.
                        grants:
                        - named_services:use
                        - canvas:read
                      search:
                        operation: object.search
                        label: Search canvas
                        description: Search canvas objects visible to the delegated connection.
                        grants:
                        - named_services:use
                        - canvas:read
                      upsert:
                        operation: object.upsert
                        label: Write canvas
                        description: Create or update a canvas object.
                        grants:
                        - named_services:use
                        - canvas:write
                      call:
                        label: Generic canvas call
                        description: Generic canvas namespace call with per-operation grants.
                        operations:
                          provider.about:
                            label: About canvas
                            description: Explain the canvas namespace and how to use it.
                            grants:
                            - named_services:use
                            - canvas:read
                          object.list:
                            label: List canvas objects
                            description: List canvas objects visible to the delegated connection.
                            grants:
                            - named_services:use
                            - canvas:read
                          object.schema:
                            label: Canvas schema
                            description: Read the object schema for canvas objects.
                            grants:
                            - named_services:use
                            - canvas:read
                          object.search:
                            label: Search canvas
                            description: Search canvas objects visible to the delegated connection.
                            grants:
                            - named_services:use
                            - canvas:read
                          object.upsert:
                            label: Write canvas
                            description: Create or update a canvas object.
                            grants:
                            - named_services:use
                            - canvas:write
                  conv:
                    label: Conversations
                    description: KDCube conversations for the approving user.
                    authority_id: delegated_client
                    tools:
                      about:
                        operation: provider.about
                        label: About conversations
                        description: Explain the conversations namespace and how to use it.
                        grants:
                        - named_services:use
                        - conversations:read
                      list:
                        operation: object.list
                        label: List conversations
                        description: List the delegated user's conversations.
                        grants:
                        - named_services:use
                        - conversations:read
                      schema:
                        operation: object.schema
                        label: Conversation schema
                        description: Read the object schema for conversations.
                        grants:
                        - named_services:use
                        - conversations:read
                      search:
                        operation: object.search
                        label: Search conversations
                        description: Search the delegated user's conversations.
                        grants:
                        - named_services:use
                        - conversations:read
                      get:
                        operation: object.get
                        label: Read one conversation
                        description: Read one full conversation by ref.
                        grants:
                        - named_services:use
                        - conversations:read
                      call:
                        label: Generic conversations call
                        description: Generic conversations namespace call with per-operation grants.
                        operations:
                          provider.about:
                            label: About conversations
                            description: Explain the conversations namespace and how to use it.
                            grants:
                            - named_services:use
                            - conversations:read
                          object.list:
                            label: List conversations
                            description: List the delegated user's conversations.
                            grants:
                            - named_services:use
                            - conversations:read
                          object.schema:
                            label: Conversation schema
                            description: Read the object schema for conversations.
                            grants:
                            - named_services:use
                            - conversations:read
                          object.search:
                            label: Search conversations
                            description: Search the delegated user's conversations.
                            grants:
                            - named_services:use
                            - conversations:read
                          object.get:
                            label: Read one conversation
                            description: Read one full conversation by ref.
                            grants:
                            - named_services:use
                            - conversations:read
                  mail:
                    label: Mail
                    description: Search, read, download attachments from, send, and forward messages through connected mail
                      accounts.
                    authority_id: delegated_client
                    tools:
                      about:
                        operation: provider.about
                        label: About mail
                        description: Explain the mail namespace and connected-account model.
                        grants:
                        - named_services:use
                      capabilities:
                        operation: provider.capabilities
                        label: Mail capabilities
                        description: Read provider capabilities for connected mail accounts.
                        grants:
                        - named_services:use
                      list:
                        operation: object.list
                        label: List mail accounts
                        description: List connected mail accounts available to the delegated connection.
                        grants:
                        - named_services:use
                        - mail:read
                      schema:
                        operation: object.schema
                        label: Mail schema
                        description: Read the mail object schema and ref format.
                        grants:
                        - named_services:use
                      search:
                        operation: object.search
                        label: Search mail
                        description: Search messages in connected mail accounts.
                        grants:
                        - named_services:use
                        - mail:read
                      get:
                        operation: object.get
                        label: Read mail message
                        description: Read one mail message and its attachment metadata by ref.
                        grants:
                        - named_services:use
                        - mail:read
                      action:
                        operation: object.action
                        label: Mail action
                        description: Download attachments, send mail, or forward a message through a connected mail account.
                        operations:
                          object.action.download_attachments:
                            label: Download mail attachments
                            description: Download attachments from one mail message.
                            grants:
                            - named_services:use
                            - mail:read
                          object.action.send:
                            label: Send mail
                            description: Send a new message from a connected mail account.
                            grants:
