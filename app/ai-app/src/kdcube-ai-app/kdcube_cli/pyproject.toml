[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdcube-cli"
version = "2026.09.10.2312"
description = "KDCube Apps bootstrap CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx2>=2.0,<2.1; python_version < '3.10'",
    "httpx2>=2.5,<3; python_version >= '3.10'",
    "rich>=13.9.4",
    "readchar>=4.0.5",
    "PyYAML>=6.0.1",
]
license = {file = "LICENSE"}

[project.scripts]
kdcube-setup = "kdcube_cli.cli:main"
kdcube = "kdcube_cli.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
kdcube_cli = ["assets/*.svg", "assets/*.png"]
