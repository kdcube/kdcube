          # Legacy connection-provider app registry. New per-user delegated
          # external credentials live under delegated_to_kdcube below.
        providers: {}

        delegated_to_kdcube:
          enabled: false
          oauth:
              # Public base for the delegated_to_kdcube_oauth_callback route.
              # Empty -> derived from the request host at runtime.
            public_base_url: "https://<PUBLIC_HOST>"
          providers:
            google:
              label: "Google"
              adapter: "google.oauth"
              enabled: true
              connector_apps:
                gmail:
                  label: "Gmail"
                  enabled: true
                  client_id: "<GOOGLE_OAUTH_CLIENT_ID>"
                  client_secret_ref: "connections.delegated_to_kdcube.providers.google.connector_apps.gmail.client_secret"
                  allowed_claims:
                  - "gmail:read"
                  - "gmail:send"
                  - "sheets:read"
                  - "sheets:write"
                  - "docs:read"
                  - "docs:write"
                  - "docs:comment"
              claims:
                gmail:read:
                  label: "Read Gmail"
                  description: "Search and read Gmail messages for the approving user."
                  provider_scopes:
                  - "openid"
                  - "email"
                  - "profile"
                  - "https://www.googleapis.com/auth/gmail.readonly"
                gmail:send:
                  label: "Send Gmail"
                  description: "Send email through the approving user's Gmail account."
                  provider_scopes:
                  - "openid"
                  - "email"
                  - "profile"
                  - "https://www.googleapis.com/auth/gmail.send"
                sheets:read:
                  label: "Read Google Sheets"
                  description: "Find spreadsheets and read their metadata and values."
                  provider_scopes:
                  - "openid"
                  - "email"
                  - "profile"
                  - "https://www.googleapis.com/auth/spreadsheets.readonly"
                  - "https://www.googleapis.com/auth/drive.metadata.readonly"
                sheets:write:
                  label: "Edit Google Sheets"
                  description: "Create and edit spreadsheets, tabs, values, and formatting."
                  provider_scopes:
                  - "openid"
                  - "email"
                  - "profile"
                  - "https://www.googleapis.com/auth/spreadsheets"
                  - "https://www.googleapis.com/auth/drive.metadata.readonly"
                  - "https://www.googleapis.com/auth/drive.file"
                docs:read:
                  label: "Read Google Docs"
                  description: "Find documents and read or export their content."
                  provider_scopes:
                  - "openid"
                  - "email"
                  - "profile"
                  - "https://www.googleapis.com/auth/documents.readonly"
                  - "https://www.googleapis.com/auth/drive.readonly"
                docs:write:
                  label: "Edit Google Docs"
                  description: "Create, copy, edit, embed images into, and import Google documents."
                  provider_scopes:
                  - "openid"
                  - "email"
                  - "profile"
                  - "https://www.googleapis.com/auth/documents"
                  - "https://www.googleapis.com/auth/drive.file"
                docs:comment:
                  label: "Comment on Google Docs"
                  description: "Read and write comments and replies on Google documents."
                  provider_scopes:
                  - "openid"
                  - "email"
                  - "profile"
                  - "https://www.googleapis.com/auth/drive"
            slack:
              label: "Slack"
              adapter: "slack.oauth_user_token"
              enabled: true
              connector_apps:
                slack-demo:
                  label: "KDCube Slack"
                  enabled: true
                  client_id: "<SLACK_OAUTH_CLIENT_ID>"
                  client_secret_ref: "connections.delegated_to_kdcube.providers.slack.connector_apps.slack-demo.client_secret"
                  allowed_claims:
                  - "slack:search"
                  - "slack:post"
                  - "slack:channels"
                  - "slack:history"
                  - "slack:files:read"
                  - "slack:files:write"
                  - "slack:assistant:search"
              claims:
                slack:search:
                  label: "Search Slack"
                  description: "Search Slack content visible to the approving user."
                  provider_scopes:
                    - "search:read"
                slack:post:
                  label: "Post to Slack"
                  description: "Post messages into Slack destinations allowed by the approving user."
                  provider_scopes:
                  - "chat:write"
                  - "im:write"
                slack:channels:
                  label: "List Slack channels"
                  description: "List Slack conversations visible to the approving user."
                  provider_scopes:
                  - "channels:read"
                  - "groups:read"
                  - "im:read"
                  - "mpim:read"
                slack:history:
                  label: "Read Slack history"
                  description: "Read Slack conversation history visible to the approving user."
                  provider_scopes:
                  - "channels:history"
                  - "groups:history"
                  - "im:history"
                  - "mpim:history"
                slack:files:read:
                  label: "Read Slack files"
                  description: "Read and download Slack files visible to the approving user."
                  provider_scopes:
                  - "files:read"
                slack:files:write:
                  label: "Upload Slack files"
                  description: "Upload files to Slack destinations allowed by the approving user."
                  provider_scopes:
                  - "files:write"
                  - "im:write"
                slack:assistant:search:
                  label: "Use Slack assistant search"
                  description: "Use Slack AI semantic search across messages, files, channels, and users where available."
                  provider_scopes:
                  - "search:read.public"
                  - "search:read.private"
                  - "search:read.im"
                  - "search:read.mpim"
                  - "search:read.files"
                  - "search:read.users"
            linkedin:
              label: "LinkedIn"
              adapter: "linkedin.oauth_member"
              enabled: true
              connector_apps:
                demo:
                  label: "KDCube LinkedIn"
                  enabled: true
                  client_id: "<LINKEDIN_OAUTH_CLIENT_ID>"
                  client_secret_ref: "connections.delegated_to_kdcube.providers.linkedin.connector_apps.demo.client_secret"
                  allowed_claims:
                  - "linkedin:profile"
                  - "linkedin:post"
              claims:
                linkedin:profile:
                  label: "Read your LinkedIn profile"
                  description: "Read the approving member's own LinkedIn name and email."
                  provider_scopes:
                  - "openid"
                  - "profile"
                  - "email"
                # w_member_social covers posting AND commenting; LinkedIn has no
                # separate comment scope outside Community Management API.
                linkedin:post:
                  label: "Post and comment on LinkedIn"
                  description: "Publish posts and comments on LinkedIn as the approving member."
                  provider_scopes:
                  - "w_member_social"
            s1:
              label: "S1"
              adapter: "oidc.generic"
              enabled: false
              oauth:
                authorize_url: "https://s1.example.com/oauth2/authorize"
                token_url: "https://s1.example.com/oauth2/token"
                userinfo_url: "https://s1.example.com/oauth2/userInfo"
                default_scopes:
                - "openid"
                - "email"
                - "profile"
                authorize_params:
                  audience: "s1-api"
                profile:
                  subject: "sub"
                  email: "email"
                  display_name: "name"
                  workspace: "custom.tenant"
              connector_apps:
                default:
                  label: "S1 connector"
                  enabled: true
                  client_id: "<S1_OIDC_CLIENT_ID>"
                  client_secret_ref: "connections.delegated_to_kdcube.providers.s1.connector_apps.default.client_secret"
                  allowed_claims:
                  - "s1:read"
                  - "s1:write"
              claims:
                s1:read:
                  label: "Read S1"
                  description: "Read S1 data for the approving user."
                  provider_scopes:
                  - "s1.read"
                s1:write:
                  label: "Write S1"
                  description: "Write S1 data for the approving user."
                  provider_scopes:
                  - "s1.write"
            icloud_mail:
              label: "iCloud Mail"
              adapter: "email.imap_smtp_app_password"
              enabled: true
              connector_apps:
                app_password:
                  label: "iCloud app-specific password"
                  enabled: true
                  allowed_claims:
                  - "email:read"
                  - "email:send"

              claims:
                email:read:
                  label: "Read mail"
                  description: "Read mail through IMAP for the connected mailbox."
                email:send:
                  label: "Send mail"
                  description: "Send mail through SMTP for the connected mailbox."
      identity:
        enabled: true
        authenticator_selector_cache:
          enabled: true
          ttl_seconds: 30
          # Target architecture:
          #   verified external identity -> Connection Hub connection edge
          #   -> platform principal/role resolver
          #
          # This template keeps role_resolver.mode=platform so the hub does NOT
          # decide entitlements itself. For local demos only, set mode=configured
          # and add role_bindings below.
        role_resolver:
          mode: "platform"
        role_bindings:
            # "<PLATFORM_USER_ID>":
            #   roles:
            #     - "kdcube:role:admin"
            #   permissions:
            #     - "connection-hub:*"
          # Descriptor-defined request authenticators are immutable deployment
          # rows. The Connections widget can add more rows into Postgres, but
          # both shapes carry metadata only. Secret values live in
          # bundles.secrets.yaml at each row's secret_ref.
        authenticators:
        - id: "telegram.kdcube_ref"
          provider: "telegram"
          authority_id: "telegram.kdcube_ref"
          where: "built-in"
          enabled: true
          role_providing: false
              # subject_namespace is optional for provider-native subjects
              # such as Telegram; it defaults to provider. Use it for generic
              # providers like OIDC/webhook/api-key when the subject namespace
              # is not the same as the verifier provider.
          secret_ref: "identity.authenticators.telegram_kdcube_ref.bot_token"
          definition:
            label: "KDCube Ref Telegram bot"
            bot_name: "kdcube-ref"
            bot_username: "kdcube_doc_bot"
            web_app_auth_max_age_seconds: 86400
        link_flows:
          telegram:
            enabled: true
            challenge_ttl_seconds: 600
              # Optional URL used by Telegram-first flows after Telegram proof is
              # created. Empty -> derived as public/widgets/connections_settings.
              # Supported replacement: {challenge_id}.
            platform_claim_url: ""

      ui:
        widgets:
          connections_settings:
            enabled: true
            src_folder: "ui/widgets/connections"
            build_command: "npm install --no-package-lock && OUTDIR=<VI_BUILD_DEST_ABSOLUTE_PATH> npm run build"
