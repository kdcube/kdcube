bundles:
  version: "1"
  default_bundle_id: "connection-hub@1-0"
  items:
  - id: "connection-hub@1-0"
    name: "Connection Hub"
    path: "<LOCAL_HOST_BUNDLE_ROOT>"
    module: "entrypoint"
    singleton: false
    config:
      surfaces:
        as_provider:
          bundle:
            visibility:
              allowed_roles: []
          api:
            operations:
              named_service:
                visibility: &default_visibility
                  user_types: []
                  roles: []
              connections_catalog:
                visibility: *default_visibility
              connections_start_oauth:
                visibility: *default_visibility
              connections_disconnect:
                visibility: *default_visibility
              connection_edges_list:
                visibility: *default_visibility
              connection_edge_upsert:
                visibility: *default_visibility
              connection_edge_remove:
                visibility: *default_visibility
              connection_edge_challenge_create:
                visibility: *default_visibility
              connection_edge_challenge_claim:
                visibility: *default_visibility
              connection_edge_challenge_status:
                visibility: *default_visibility
              identity_resolve:
                visibility: *default_visibility
              identity_family_resolve:
                visibility: *default_visibility
              delegated_identity_scope_resolve:
                visibility: *default_visibility
              delegated_access_list:
                visibility: *default_visibility
              delegated_access_create:
                visibility: *default_visibility
              delegated_access_update:
                visibility: *default_visibility
              delegated_access_revoke:
                visibility: *default_visibility
              delegated_to_kdcube_catalog:
                visibility: *default_visibility
              delegated_to_kdcube_start_oauth:
                visibility: *default_visibility
              delegated_to_kdcube_connect_credential:
                visibility: *default_visibility
              delegated_to_kdcube_disconnect:
                visibility: *default_visibility
              delegated_to_kdcube_resolve:
                visibility: *default_visibility
              email_accounts_status:
                visibility: *default_visibility
              email_connect_app_password:
                visibility: *default_visibility
              email_disconnect_account:
                visibility: *default_visibility
              connections_settings:
                visibility: *default_visibility
          widget:
            connections_settings:
              visibility: *default_visibility

      connections:
        oauth:
            # Public base for Connection Hub browser callbacks when a flow does
            # not have a more specific public_base_url.
            # Empty -> derived from the request host at runtime.
          public_base_url: "https://<PUBLIC_HOST>"
        delegated_credentials:
          oauth:
            enabled: false
            brand: "KDCube"
              # Optional: render delegated credential consent in a bundle-hosted
              # UI declared on an authority provider. Connection Hub still owns
              # approve/deny validation and token issuance.
              # consent_ui:
              #   authority_ref:
              #     authority_id: "kdcube.platform"
              #     provider_id: "<platform_provider_id>"
              #     entrypoint: "consent"
            issuer: ""
            public_clients:
            - client_id: "claude"
              redirect_uris:
              - "http://localhost/callback"
              - "http://127.0.0.1/callback"
              - "https://claude.ai/api/mcp/auth_callback"
            dynamic_client_registration:
              enabled: true
              allowed_redirect_uris:
              - "https://claude.ai/api/mcp/auth_callback"
              - "http://localhost/callback"
              - "http://127.0.0.1/callback"
            client_id_metadata_documents:
              enabled: true
              # Empty permits any public HTTPS metadata host. Set domains to
              # narrow this deployment to operator-approved client publishers.
              allowed_domains: []
              allow_subdomains: true
            capabilities:
            - grant: "kdcube:role:super-admin"
              label: "Use all platform and application APIs"
              description: "Admin-only delegated automation access to platform and application APIs."
              delegable_roles:
              - "kdcube:role:super-admin"
            - grant: "conversations:read"
              label: "Read your conversations"
              description: "Read the approving user's own KDCube conversations through delegated named-service tools."
              delegable_roles:
              - "kdcube:role:registered"
              - "kdcube:role:paid"
              - "kdcube:role:privileged"
              - "kdcube:role:super-admin"
              delegable_permissions:
              - "kdcube:*:conversations:*;read"
            - grant: "conversations:read:any_user"
              label: "Read any user's conversations"
              description: "Admin: read a selected user's conversations through the conv named service."
              delegable_roles:
              - "kdcube:role:super-admin"
              delegable_permissions:
              - "kdcube:*:conversations:*;read:any_user"
            - grant: "memories:read"
              label: "Read memories"
              description: "Read memory notes visible to the KDCube user who approves the connection."
              delegable_roles:
              - "kdcube:role:registered"
              - "kdcube:role:paid"
              - "kdcube:role:privileged"
              - "kdcube:role:super-admin"
              delegable_permissions:
              - "memories:read"
            - grant: "knowledge:read"
              label: "Read KDCube knowledge"
              description: "Read KDCube knowledge notes through delegated MCP tools."
              delegable_roles:
              - "kdcube:role:registered"
              - "kdcube:role:paid"
              - "kdcube:role:privileged"
              - "kdcube:role:super-admin"
              delegable_permissions:
              - "knowledge:read"
            - grant: "named_services:use"
              label: "Use KDCube named services"
              description: "Discover and call configured KDCube named-service namespaces through delegated MCP tools."
              delegable_roles:
              - "kdcube:role:registered"
              - "kdcube:role:paid"
              - "kdcube:role:privileged"
              - "kdcube:role:super-admin"
              delegable_permissions:
              - "named_services:use"
            - grant: "mail:read"
              label: "Read connected mail"
              description: "Search and read messages and attachments from mail accounts connected to KDCube."
              delegable_roles:
              - "kdcube:role:registered"
              - "kdcube:role:paid"
              - "kdcube:role:privileged"
              - "kdcube:role:super-admin"
              delegable_permissions:
              - "mail:read"
              # mail:read is a provider-neutral door claim; the connected account
              # that backs it holds a PROVIDER claim (gmail:read), so the consent
              # page can only resolve which account to connect from this mapping.
              # Keep in step with MAIL_CONNECTED_ACCOUNT_REQUIREMENTS.
              connected_accounts:
              - provider_id: "google"
                claims: ["gmail:read"]
            - grant: "mail:send"
              label: "Send connected mail"
              description: "Send or forward messages through mail accounts connected to KDCube."
              delegable_roles:
              - "kdcube:role:registered"
              - "kdcube:role:paid"
              - "kdcube:role:privileged"
              - "kdcube:role:super-admin"
              delegable_permissions:
              - "mail:send"
              connected_accounts:
              - provider_id: "google"
                claims: ["gmail:send"]
            - grant: "sheets:read"
              label: "Read Google Sheets"
              description: "Find spreadsheets and read their metadata and values through a connected Google account."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["sheets:read"]
            - grant: "sheets:write"
              label: "Edit Google Sheets"
              description: "Create and edit spreadsheets, tabs, values, and formatting through a connected Google account."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["sheets:write"]
            - grant: "docs:read"
              label: "Read Google Docs"
              description: "Find documents and read or export their content through a connected Google account."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["docs:read"]
            - grant: "docs:write"
              label: "Edit Google Docs"
              description: "Create, copy, edit, embed images into, and import Google documents through a connected Google account."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["docs:write"]
            - grant: "docs:comment"
              label: "Comment on Google Docs"
              description: "Read and write comments and replies on Google documents through a connected Google account."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["docs:comment"]
            # Slack is a single provider, so it uses its OWN real claims (the
            # exact capabilities the Slack API needs) — not an invented
            # namespace claim. These match SLACK_CONNECTED_ACCOUNT_CLAIMS.
            - grant: "slack:search"
              label: "Search Slack"
              description: "Search messages and files through connected Slack accounts."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["slack:search"]
            - grant: "slack:channels"
              label: "List Slack channels"
              description: "List channels and workspaces through connected Slack accounts."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["slack:channels"]
            - grant: "slack:history"
              label: "Read Slack history"
              description: "Read channel message history through connected Slack accounts."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["slack:history"]
            - grant: "slack:files:read"
              label: "Read Slack files"
              description: "Download files through connected Slack accounts."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["slack:files:read"]
            - grant: "slack:files:write"
              label: "Upload Slack files"
              description: "Upload files through connected Slack accounts."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["slack:files:write"]
            - grant: "slack:post"
              label: "Post to Slack"
              description: "Post messages through connected Slack accounts."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["slack:post"]
            - grant: "slack:assistant:search"
              label: "Slack assistant search"
              description: "Inspect Slack assistant search availability through connected Slack accounts."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["slack:assistant:search"]
            # LinkedIn, same rule: its own real claims. linkedin:post covers
            # posts and comments because both ride w_member_social.
            - grant: "linkedin:profile"
              label: "Read LinkedIn profile"
              description: "Read the connected LinkedIn member's own profile."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["linkedin:profile"]
            - grant: "linkedin:post"
              label: "Post and comment on LinkedIn"
              description: "Publish posts and comments through connected LinkedIn accounts."
              delegable_roles: ["kdcube:role:registered", "kdcube:role:paid", "kdcube:role:privileged", "kdcube:role:super-admin"]
              delegable_permissions: ["linkedin:post"]
            resources:
            - resource: "*"
              label: "All platform and application APIs"
              admin_only: true
              grants:
              - "kdcube:role:super-admin"
            - resource: "*/api/integrations/bundles/*/*/user-memories@2026-06-26/public/mcp/memories*"
              label: "User memories MCP"
              identity_scope: "grantor_identity_family"
              tools:
                memory_search:
                  label: "Search memories"
                  description: "Search the user's memory notes."
                  grants:
                  - "memories:read"
                memory_get:
                  label: "Read memory"
                  description: "Read one memory note by id."
                  grants:
                  - "memories:read"
            - resource: "*/api/integrations/bundles/*/*/knowledge@1-0/public/mcp/knowledge_managed*"
              label: "KDCube knowledge MCP"
              tools:
                get_access_context:
                  label: "Get access context"
                  description: "Inspect the current knowledge access context."
                  grants:
                  - "knowledge:read"
                about:
                  label: "About KDCube knowledge"
                  description: "Explain when and how to use the KDCube knowledge server."
                  grants:
                  - "knowledge:read"
                search:
                  label: "Search knowledge"
                  description: "Search KDCube knowledge visible to this delegated connection."
                  grants:
                  - "knowledge:read"
                read_refs:
                  label: "Read references"
                  description: "Read exact knowledge or source references returned by search."
                  grants:
                  - "knowledge:read"
            - resource: "*/api/integrations/bundles/*/*/kdcube-services@1-0/public/mcp/named_services*"
              label: "KDCube named services MCP"
              tools:
                named_services_list:
                  label: "List named services"
                  description: "List configured named-service namespaces and operation grants."
                  grants:
                  - "named_services:use"
                named_services_about:
                  label: "Named service about"
                  description: "Read a provider about payload for a configured namespace."
                  grants:
                  - "named_services:use"
                named_services_capabilities:
                  label: "Named service capabilities"
                  description: "Read provider capabilities for a configured namespace."
                  grants:
                  - "named_services:use"
                named_services_schema:
                  label: "Named service schema"
                  description: "Read an object schema for a configured namespace."
                  grants:
                  - "named_services:use"
                named_services_search:
                  label: "Named service search"
                  description: "Search objects in a configured namespace."
                  grants:
                  - "named_services:use"
                named_services_get:
                  label: "Named service get"
                  description: "Read one object from a configured namespace."
                  grants:
                  - "named_services:use"
                named_services_upsert:
                  label: "Named service upsert"
                  description: "Create or update one object in a configured namespace."
                  grants:
                  - "named_services:use"
                named_services_host_file:
                  label: "Named service host file"
                  description: "Host or register a file/ref in a configured namespace."
                  grants:
                  - "named_services:use"
                named_services_action:
                  label: "Named service action"
                  description: "Run a bounded provider action on one object."
                  grants:
                  - "named_services:use"
                named_services_delete:
                  label: "Named service delete"
                  description: "Delete or archive one object in a configured namespace."
                  grants:
                  - "named_services:use"
                named_services_call:
                  label: "Named service call"
                  description: "Run a generic call against a configured namespace."
                  grants:
                  - "named_services:use"
              named_services:
                connector_apps:
                  slack: "slack-demo"
                  google: "gmail"
                namespaces:
                  mail:
                    label: "Mail"
                    description: "Search, read, download attachments from, send, and forward messages through connected mail accounts."
                    authority_id: "delegated_client"
                    tools:
                      about:
                        operation: "provider.about"
                        label: "About mail"
                        description: "Explain the mail namespace and connected-account model."
                        grants:
                        - "named_services:use"
                      capabilities:
                        operation: "provider.capabilities"
                        label: "Mail capabilities"
                        description: "Read provider capabilities for connected mail accounts."
                        grants:
                        - "named_services:use"
                      list:
                        operation: "object.list"
                        label: "List mail accounts"
                        description: "List connected mail accounts available to the delegated connection."
                        grants:
                        - "named_services:use"
                        - "mail:read"
                      schema:
                        operation: "object.schema"
                        label: "Mail schema"
                        description: "Read the mail object schema and ref format."
                        grants:
                        - "named_services:use"
                      search:
                        operation: "object.search"
                        label: "Search mail"
                        description: "Search messages in connected mail accounts."
                        grants:
                        - "named_services:use"
                        - "mail:read"
                      get:
                        operation: "object.get"
                        label: "Read mail message"
                        description: "Read one mail message and its attachment metadata by ref."
                        grants:
                        - "named_services:use"
                        - "mail:read"
                      action:
                        operation: "object.action"
                        label: "Mail action"
                        description: "Download attachments, send mail, or forward a message through a connected mail account."
                        operations:
                          object.action.download_attachments:
                            label: "Download mail attachments"
                            description: "Download attachments from one mail message."
                            grants:
                            - "named_services:use"
                            - "mail:read"
                          object.action.send:
                            label: "Send mail"
                            description: "Send a new message from a connected mail account."
                            grants:
                            - "named_services:use"
                            - "mail:send"
                          object.action.forward:
                            label: "Forward mail"
                            description: "Forward an existing message, optionally with its attachments."
                            grants:
                            - "named_services:use"
                            - "mail:read"
                            - "mail:send"
                          object.action.request_upload:
                            label: "Stage mail attachment"
                            description: "Reserve an upload slot for an outbound mail attachment."
                            grants:
                            - "named_services:use"
                            - "mail:send"
                          object.action.discard_upload:
                            label: "Discard staged mail attachment"
                            description: "Discard one staged outbound attachment."
                            grants:
                            - "named_services:use"
                            - "mail:send"
                      call:
                        label: "Generic mail call"
                        description: "Generic mail namespace call with per-operation grants."
                        operations:
                          provider.about:
                            label: "About mail"
                            description: "Explain the mail namespace and connected-account model."
                            grants:
                            - "named_services:use"
                          provider.capabilities:
                            label: "Mail capabilities"
                            description: "Read provider capabilities for connected mail accounts."
                            grants:
                            - "named_services:use"
                          object.list:
                            label: "List mail accounts"
                            description: "List connected mail accounts available to the delegated connection."
                            grants:
                            - "named_services:use"
                            - "mail:read"
                          object.schema:
                            label: "Mail schema"
                            description: "Read the mail object schema and ref format."
                            grants:
                            - "named_services:use"
                          object.search:
                            label: "Search mail"
                            description: "Search messages in connected mail accounts."
                            grants:
                            - "named_services:use"
                            - "mail:read"
                          object.get:
                            label: "Read mail message"
                            description: "Read one mail message and its attachment metadata by ref."
                            grants:
                            - "named_services:use"
                            - "mail:read"
                          object.action.download_attachments:
                            label: "Download mail attachments"
                            description: "Download attachments from one mail message."
                            grants:
                            - "named_services:use"
                            - "mail:read"
                          object.action.send:
                            label: "Send mail"
                            description: "Send a new message from a connected mail account."
                            grants:
                            - "named_services:use"
                            - "mail:send"
                          object.action.forward:
                            label: "Forward mail"
                            description: "Forward an existing message, optionally with its attachments."
                            grants:
                            - "named_services:use"
                            - "mail:read"
                            - "mail:send"
                          object.action.request_upload:
                            label: "Stage mail attachment"
                            description: "Reserve an upload slot for an outbound mail attachment."
                            grants:
                            - "named_services:use"
                            - "mail:send"
                          object.action.discard_upload:
                            label: "Discard staged mail attachment"
                            description: "Discard one staged outbound attachment."
                            grants:
                            - "named_services:use"
                            - "mail:send"
                  sheets:
                    label: "Spreadsheets"
                    description: "Find, inspect, read, create, and edit spreadsheets through connected accounts."
                    authority_id: "delegated_client"
                    tools:
                      about:
                        operation: "provider.about"
                        label: "About spreadsheets"
                        description: "Explain the sheets namespace, object refs, and connected-account model."
                        grants:
                        - "named_services:use"
                      capabilities:
                        operation: "provider.capabilities"
                        label: "Spreadsheet capabilities"
                        description: "Read the bounded operations available for connected spreadsheets."
                        grants:
                        - "named_services:use"
                      list:
                        operation: "object.list"
                        label: "List recent spreadsheets"
                        description: "List recently modified spreadsheets visible to the connected account."
                        grants:
                        - "named_services:use"
                        - "sheets:read"
                      schema:
                        operation: "object.schema"
                        label: "Spreadsheet schema"
                        description: "Read spreadsheet and tab refs, fields, ranges, and mutation payloads."
                        grants:
                        - "named_services:use"
                      search:
                        operation: "object.search"
                        label: "Search spreadsheets"
                        description: "Find spreadsheets by title through a connected account."
                        grants:
                        - "named_services:use"
                        - "sheets:read"
                      get:
                        operation: "object.get"
                        label: "Read spreadsheet"
                        description: "Inspect spreadsheet metadata or read explicit bounded ranges by ref."
                        grants:
                        - "named_services:use"
                        - "sheets:read"
                      upsert:
                        operation: "object.upsert"
                        label: "Create or update spreadsheet"
                        description: "Create a spreadsheet, replace explicit values, or update tab properties."
                        grants:
                        - "named_services:use"
                        - "sheets:write"
                      action:
                        operation: "object.action"
                        label: "Spreadsheet action"
                        description: "Append or clear values, manage tabs, or format a bounded range."
                        operations:
                          object.action.update_values:
                            label: "Update spreadsheet values"
                            description: "Replace values in one explicit A1 range."
                            grants: ["named_services:use", "sheets:write"]
                          object.action.append_rows:
                            label: "Append spreadsheet rows"
                            description: "Append rows to one explicit range."
                            grants: ["named_services:use", "sheets:write"]
                          object.action.clear_values:
                            label: "Clear spreadsheet values"
                            description: "Clear values from one explicit range."
                            grants: ["named_services:use", "sheets:write"]
                          object.action.add_tab:
                            label: "Add spreadsheet tab"
                            description: "Add one tab to a spreadsheet."
                            grants: ["named_services:use", "sheets:write"]
                          object.action.update_tab:
                            label: "Update spreadsheet tab"
                            description: "Rename or update one spreadsheet tab."
                            grants: ["named_services:use", "sheets:write"]
                          object.action.delete_tab:
                            label: "Delete spreadsheet tab"
                            description: "Delete one spreadsheet tab."
                            grants: ["named_services:use", "sheets:write"]
                          object.action.format_range:
                            label: "Format spreadsheet range"
                            description: "Apply bounded formatting to one explicit range."
                            grants: ["named_services:use", "sheets:write"]
                      delete:
                        operation: "object.delete"
                        label: "Delete spreadsheet tab"
                        description: "Delete one tab by stable tab ref; spreadsheet-file deletion is not exposed."
                        grants: ["named_services:use", "sheets:write"]
                      call:
                        label: "Generic spreadsheet call"
                        description: "Generic sheets namespace call with per-operation grants."
                        operations:
                          provider.about:
                            label: "About spreadsheets"
                            description: "Explain the sheets namespace and connected-account model."
                            grants: ["named_services:use"]
                          provider.capabilities:
                            label: "Spreadsheet capabilities"
                            description: "Read the operations available for connected spreadsheets."
                            grants: ["named_services:use"]
                          object.list:
                            label: "List recent spreadsheets"
                            description: "List recently modified spreadsheets."
                            grants: ["named_services:use", "sheets:read"]
                          object.schema:
                            label: "Spreadsheet schema"
                            description: "Read spreadsheet and tab refs, fields, ranges, and mutation payloads."
                            grants: ["named_services:use"]
                          object.search:
                            label: "Search spreadsheets"
                            description: "Find spreadsheets by title."
                            grants: ["named_services:use", "sheets:read"]
                          object.get:
                            label: "Read spreadsheet"
                            description: "Inspect metadata or read explicit bounded ranges."
                            grants: ["named_services:use", "sheets:read"]
                          object.upsert:
                            label: "Create or update spreadsheet"
                            description: "Create a spreadsheet, replace values, or update tab properties."
                            grants: ["named_services:use", "sheets:write"]
                          object.action.update_values:
                            label: "Update spreadsheet values"
                            description: "Replace values in one explicit A1 range."
                            grants: ["named_services:use", "sheets:write"]
                          object.action.append_rows:
                            label: "Append spreadsheet rows"
                            description: "Append rows to one explicit range."
                            grants: ["named_services:use", "sheets:write"]
                          object.action.clear_values:
                            label: "Clear spreadsheet values"
                            description: "Clear values from one explicit range."
                            grants: ["named_services:use", "sheets:write"]
