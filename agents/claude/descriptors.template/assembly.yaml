context:
  tenant: standalone
  project: agent-harness-claude

paths:
  host_bundle_storage_path: ../output/bundle-storage

infra:
  postgres:
    host: 127.0.0.1
    port: 55434
    user: kdcube_agents
    database: kdcube_agents
    postgres_ssl: false
  redis:
    host: 127.0.0.1
    port: 56381
    topology: standalone

storage:
  kdcube: ../output/kdcube-storage
  workspace:
    type: local
    repo: ""
  claude_code_session:
    type: git
    repo: ../output/claude-session-store.git

models:
  default_llm_provider: anthropic
  default_llm_model_id: claude-haiku-4-5-20251001

secrets:
  provider: secrets-file

platform:
  services:
    proc:
      bundles:
        bundle_storage_root: ../output/bundle-storage
      tools:
        web_search:
          web_search_primary_backend: duckduckgo
          web_search_backend: duckduckgo
      exec:
        py_code_exec_image: py-code-exec:latest
        py_code_exec_timeout: 600
        py_code_exec_network_mode: auto
        py_code_exec_container_strategy: split
        max_file_bytes: 100m
        max_exec_workspace_delta_bytes: 250m
        max_workspace_bytes: 500m
        workspace_monitor_interval_s: 0.5

services:
  git:
    git_ssh_key_path: null
    git_ssh_known_hosts: null
    git_ssh_strict_host_key_checking: "yes"
