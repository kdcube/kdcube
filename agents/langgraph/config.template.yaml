agent:
  input:
    user_id: demo-user
    user_type: regular
    session_id: local-session
    conversation_id: langgraph-demo
    recall_conversation_id: langgraph-recall-demo
  ingress:
    telegram:
      host: 127.0.0.1
      port: 8787
      path: /telegram/webhook
      bot_token_ref: platform.services.telegram.bot_token
      webhook_secret_ref: platform.services.telegram.webhook_secret
  max_tokens: 12000
  recursion_limit: 24
  topic: "the current stable Python release and its release date"
  instructions:
    profile: workspace-files
  additional_instructions: |
    You are a research agent. Use the configured tools for public-web research
    and deliverable creation. Preserve source URLs and follow enabled skills.
  run_directory: ./output
  tools:
    - id: web
      kind: python
      module: kdcube_ai_app.apps.chat.sdk.tools.web_tools
      alias: web_tools
      discovery: semantic_kernel
      allowed: [web_search, web_fetch]
      runtime:
        web_search: local
        web_fetch: local
      settings:
        filter:
          allowlist:
            - python.org
          blocklist: []
          ssrf_guard: true
        server:
          log_level: WARNING
    - id: code
      kind: python
      module: kdcube_ai_app.apps.chat.sdk.tools.exec_tools
      alias: exec_tools
      discovery: semantic_kernel
      allowed: [execute_code_python]
      runtime:
        execute_code_python: docker
    - id: conversations
      kind: python
      module: kdcube_ai_app.apps.chat.sdk.tools.conversation_tools
      alias: conversation_tools
      discovery: semantic_kernel
      allowed: [search]
      runtime:
        search: local
    - id: documents
      kind: python
      module: kdcube_ai_app.apps.chat.sdk.tools.rendering_tools
      alias: rendering_tools
      discovery: semantic_kernel
      allowed: [write_pdf, write_docx, write_pptx]
      runtime:
        write_pdf: local
        write_docx: local
        write_pptx: local
  skills:
    root: ./skills
    enabled:
      - demo.research-brief
